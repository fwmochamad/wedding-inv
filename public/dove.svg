<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f4eff9"/><stop offset="1" stop-color="#d8cbe8"/>
    </linearGradient>
    <linearGradient id="feat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f1ebf8"/><stop offset="1" stop-color="#cbbade"/>
    </linearGradient>
    <linearGradient id="featB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e3d8ef"/><stop offset="1" stop-color="#b3a0cb"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- satu helai bulu primer, mengarah ke atas dari titik 0,0 -->
    <path id="f" d="M0 0C4-9 5-28 1-42C-3-28-5-9 0 0Z"/>
  </defs>

  <g stroke="#9c86b5" stroke-width=".8" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur=".8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>

    <!-- sayap belakang -->
    <g transform="translate(60 46)">
      <g fill="url(#featB)">
        <animateTransform attributeName="transform" type="scale" values="1 1;1 -.5;1 1" dur=".8s" begin="-.12s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
        <use href="#f" transform="rotate(-62) scale(.8)"/><use href="#f" transform="rotate(-48) scale(.9)"/>
        <use href="#f" transform="rotate(-34) scale(.95)"/><use href="#f" transform="rotate(-20) scale(.9)"/>
        <path d="M-2 2C-6-10-2-22 10-26C14-16 12-6 6 2Z"/>
      </g>
    </g>

    <!-- ekor kipas -->
    <g fill="url(#feat)">
      <path d="M28 54L6 50C4 54 8 58 12 58Z"/>
      <path d="M28 56L4 60C6 64 10 66 14 63Z"/>
      <path d="M30 58L10 70C14 73 18 72 20 68Z"/>
    </g>

    <!-- badan -->
    <path fill="url(#body)" d="M26 52C36 42 56 38 74 42C78 34 88 30 96 33C102 36 104 42 101 47C96 55 86 60 72 62C56 65 38 62 26 52Z"/>
    <!-- leher & dada lembut -->
    <path fill="none" stroke="#c9b9dc" stroke-width=".7" d="M78 50C84 52 90 51 95 48"/>

    <!-- sayap depan -->
    <g transform="translate(62 46)">
      <g fill="url(#feat)">
        <animateTransform attributeName="transform" type="scale" values="1 1;1 -.55;1 1" dur=".8s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
        <use href="#f" transform="rotate(-72) scale(.85)"/><use href="#f" transform="rotate(-58) scale(1)"/>
        <use href="#f" transform="rotate(-44) scale(1.1)"/><use href="#f" transform="rotate(-30) scale(1.08)"/>
        <use href="#f" transform="rotate(-16) scale(.95)"/><use href="#f" transform="rotate(-4) scale(.78)"/>
        <!-- bulu penutup (covert) -->
        <path d="M-8 4C-14-6-10-20 2-28C8-30 14-26 14-18C14-8 10 0 6 4C2 6-4 6-8 4Z"/>
        <path fill="none" stroke="#d4c6e4" d="M-2-6C2-12 6-16 10-20M0 0C4-6 8-10 12-12"/>
      </g>
    </g>
  </g>

  <!-- kepala: mata anime, kilau, pipi merona, paruh -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur=".8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <path d="M101 41L110 43.5L101 46Z" fill="#f2b8a2" stroke="#d99a86" stroke-width=".6" stroke-linejoin="round"/>
    <ellipse cx="93" cy="39.5" rx="2.3" ry="2.7" fill="#3d2f4d"/>
    <circle cx="93.8" cy="38.5" r=".9" fill="#fff"/><circle cx="92.4" cy="40.8" r=".4" fill="#fff"/>
    <ellipse cx="94" cy="45" rx="2.6" ry="1.3" fill="#f6b6c8" opacity=".6"/>
    <ellipse cx="80" cy="44" rx="10" ry="5" fill="url(#glow)" opacity=".8"/>
  </g>
</svg>
